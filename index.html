
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROXAT Choyxona</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #183d2b, #315b3c, #142c20);
    color: white;
}

header {
    text-align: center;
    padding: 25px 10px;
    background: #10291d;
    border-bottom: 3px solid #d4a943;
}

header h1 {
    color: #f3d47a;
    margin: 0;
    font-size: 30px;
}

header p {
    margin-bottom: 0;
    color: #eee;
}

#tableNumber {
    text-align: center;
    margin: 15px auto;
    font-size: 20px;
    font-weight: bold;
    color: #ffe08a;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 12px;
}

.menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    gap: 10px;
}

.food-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.food-emoji {
    font-size: 38px;
    width: 50px;
    text-align: center;
}

.food-name {
    font-size: 17px;
    font-weight: bold;
}

.food-price {
    color: #f5d77d;
    margin-top: 5px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    background: #d5a83d;
    color: #172719;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

.cart {
    background: rgba(0,0,0,0.25);
    border: 1px solid #d5a83d;
    border-radius: 12px;
    padding: 16px;
    margin-top: 25px;
}

.cart h2 {
    color: #f5d77d;
    text-align: center;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}

.total {
    font-size: 18px;
    line-height: 1.8;
    margin-top: 15px;
}

.order-btn {
    width: 100%;
    margin-top: 15px;
    background: #22a45a;
    color: white;
    font-size: 17px;
    padding: 14px;
}

.remove-btn {
    background: #a83c32;
    color: white;
    padding: 5px 9px;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #ddd;
}
</style>
</head>

<body>

<header>
    <h1>🍽️ ROXAT CHOYXONA</h1>
    <p>Ta'mi o'zgacha, xizmati a'lo!</p>
</header>

<div id="tableNumber">Stol raqami: aniqlanmoqda...</div>

<div class="container">
    <h2>📋 TAOMLAR MENYUSI</h2>
    <div id="menu"></div>

    <div class="cart">
        <h2>🛒 SAVATCHA</h2>
        <div id="cartItems">Hozircha savatcha bo'sh</div>

        <div class="total">
            <div>Jami: <span id="subtotal">0</span> so'm</div>
            <div>Xizmat haqi (10%): <span id="service">0</span> so'm</div>
            <hr>
            <strong>Umumiy: <span id="total">0</span> so'm</strong>
        </div>

        <button class="order-btn" onclick="sendOrder()">
            📲 Telegram orqali buyurtma berish
        </button>
    </div>
</div>

<footer>© ROXAT Choyxona</footer>

<script>
const foods = [
    {name: "Sho'rva", price: 30000, emoji: "🥣"},
    {name: "Lag'mon", price: 35000, emoji: "🍜"},
    {name: "Mastava", price: 30000, emoji: "🍲"},
    {name: "Chuchvara", price: 30000, emoji: "🥟"},
    {name: "Manti (1 dona)", price: 8000, emoji: "🥟"},
    {name: "Tabaka", price: 65000, emoji: "🍗"},
    {name: "Vaguri (1 kg)", price: 280000, emoji: "🍖"},
    {name: "Jiz (1 kg)", price: 280000, emoji: "🥩"},
    {name: "Baliq (1 kg)", price: 90000, emoji: "🐟"},
    {name: "Krilishka fri", price: 40000, emoji: "🍗"},
    {name: "Fri", price: 15000, emoji: "🍟"},
    {name: "Qo'y jaz", price: 32000, emoji: "🍖"},
    {name: "Qiyma (1)", price: 20000, emoji: "🍢"},
    {name: "Qiyma (2)", price: 15000, emoji: "🍢"},
    {name: "Urdak", price: 20000, emoji: "🦆"},
    {name: "Tovuk kanot", price: 20000, emoji: "🍗"},
    {name: "Dumba", price: 25000, emoji: "🥩"},
    {name: "Mangal tovuk", price: 65000, emoji: "🔥"}
];

let cart = [];

const params = new URLSearchParams(window.location.search);
const table = params.get("stol");

if (table && Number(table) >= 1 && Number(table) <= 30) {
    document.getElementById("tableNumber").textContent =
        "🪑 Stol raqami: " + table;
} else {
    document.getElementById("tableNumber").textContent =
        "🪑 Stol raqami: ko'rsatilmagan";
}

const menu = document.getElementById("menu");

foods.forEach((food, index) => {
    const item = document.createElement("div");
    item.className = "menu-item";

    const info = document.createElement("div");
    info.className = "food-info";

    const emoji = document.createElement("div");
    emoji.className = "food-emoji";
    emoji.textContent = food.emoji;

    const details = document.createElement("div");

    const name = document.createElement("div");
    name.className = "food-name";
    name.textContent = food.name;

    const price = document.createElement("div");
    price.className = "food-price";
    price.textContent = food.price.toLocaleString("uz-UZ") + " so'm";

    details.appendChild(name);
    details.appendChild(price);

    info.appendChild(emoji);
    info.appendChild(details);

    const addButton = document.createElement("button");
    addButton.textContent = "➕ Qo'shish";
    addButton.addEventListener("click", () => addToCart(index));

    item.appendChild(info);
    item.appendChild(addButton);
    menu.appendChild(item);
});

function addToCart(index) {
    const food = foods[index];
    const existing = cart.find(item => item.name === food.name);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            name: food.name,
            price: food.price,
            quantity: 1
        });
    }

    updateCart();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.textContent = "Hozircha savatcha bo'sh";
    }

    let subtotal = 0;

    cart.forEach((item, index) => {
        subtotal += item.price * item.quantity;

        const row = document.createElement("div");
        row.className = "cart-item";

        const description = document.createElement("span");
        description.textContent =
            item.name + " × " + item.quantity +
            " — " + (item.price * item.quantity).toLocaleString("uz-UZ") +
            " so'm";

        const remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.textContent = "✖";
        remove.addEventListener("click", () => removeFromCart(index));

        row.appendChild(description);
        row.appendChild(remove);
        cartItems.appendChild(row);
    });

    const service = Math.round(subtotal * 0.10);
    const total = subtotal + service;

    document.getElementById("subtotal").textContent =
        subtotal.toLocaleString("uz-UZ");

    document.getElementById("service").textContent =
        service.toLocaleString("uz-UZ");

    document.getElementById("total").textContent =
        total.toLocaleString("uz-UZ");
}

function sendOrder() {
    if (cart.length === 0) {
        alert("Avval savatchaga taom qo'shing!");
        return;
    }

    let subtotal = 0;
    let message = "🍽️ ROXAT CHOYXONA BUYURTMASI\n\n";

    message += "🪑 Stol: " + (table || "Ko'rsatilmagan") + "\n\n";

    cart.forEach(item => {
        const sum = item.price * item.quantity;
        subtotal += sum;

        message += "• " + item.name +
            " × " + item.quantity +
            " = " + sum.toLocaleString("uz-UZ") +
            " so'm\n";
    });

    const service = Math.round(subtotal * 0.10);
    const total = subtotal + service;

    message += "\nJami: " + subtotal.toLocaleString("uz-UZ") + " so'm";
    message += "\nXizmat haqi (10%): " + service.toLocaleString("uz-UZ") + " so'm";
    message += "\nUmumiy: " + total.toLocaleString("uz-UZ") + " so'm";

    const telegramUrl =
        "https://t.me/Roxat_choyxonaa?text=" +
        encodeURIComponent(message);

    window.open(telegramUrl, "_blank");
}
</script>

</body>
</html>
