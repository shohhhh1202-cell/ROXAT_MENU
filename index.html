<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROXAT - Onlayn Menyu</title>

<style>
:root {
    --card-bg: rgba(30,30,30,.94);
    --accent: #f39c12;
    --text: #fff;
    --secondary: #d0d0d0;
    --success: #2ecc71;
}

* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg,#151515,#292929);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

header {
    text-align: center;
    background: var(--card-bg);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

h1 {
    color: var(--accent);
    margin: 0 0 8px;
    font-size: 24px;
}

#stolText {
    font-size: 16px;
    color: var(--success);
    background: #2a2a2a;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    font-weight: bold;
}

.features-box {
    background: #f39c1226;
    border: 1px solid var(--accent);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    text-align: center;
    color: #ffd885;
}

.category-title {
    color: var(--accent);
    font-size: 18px;
    margin: 20px 0 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid #ffffff33;
    grid-column: 1 / -1;
}

.menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 105px;
}

.menu-card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    align-items: center;
    box-shadow: 0 4px 10px #0008;
    min-width: 0;
}

.menu-img {
    width: 84px;
    height: 84px;
    border-radius: 8px;
    object-fit: cover;
    margin-right: 12px;
    flex-shrink: 0;
    background: #444;
}

.menu-info {
    flex: 1;
    min-width: 0;
    padding-right: 8px;
}

.menu-title {
    font-size: 15px;
    font-weight: bold;
    margin: 0 0 5px;
}

.price {
    color: var(--accent);
    font-weight: bold;
    font-size: 14px;
}

.add-btn {
    background: var(--success);
    color: white;
    border: none;
    padding: 8px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    white-space: nowrap;
}

.add-btn:active {
    transform: scale(.95);
}

.cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1af7;
    border-top: 2px solid var(--accent);
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 -4px 20px #000b;
    max-width: 600px;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
    gap: 10px;
}

.cart-info {
    font-size: 12px;
    color: var(--secondary);
}

.cart-info span {
    color: var(--text);
    font-weight: bold;
}

.tg-btn {
    background: #0088cc;
    color: white;
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    pointer-events: none;
    opacity: .5;
    text-align: center;
    white-space: nowrap;
}

.tg-btn.active {
    pointer-events: auto;
    opacity: 1;
}

@media(max-width:360px) {
    .menu-img {
        width: 70px;
        height: 70px;
        margin-right: 9px;
    }

    .add-btn {
        padding: 7px 8px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>ROXAT Choyxona</h1>
    <div id="stolText">Stol aniqlanmoqda...</div>
</header>

<div class="features-box">
    ✨ <b>Bizdagi qulayliklar:</b>
    5 km gacha bepul dastavka 🛵 |
    Xizmat haqqi: +10% 🧾 |
    30 ta stol 🪑
</div>

<div class="menu-grid" id="menuList">

<div class="category-title">🍲 Asosiy Ovqatlar & Sho'rvalar</div>
