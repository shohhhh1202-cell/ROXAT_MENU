<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXAT - Onlayn Menyu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #f39c12; margin-bottom: 5px; }
        #stolText { font-size: 20px; color: #2ecc71; font-weight: bold; margin-bottom: 20px; background: #2a2a2a; padding: 10px; border-radius: 8px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
        .menu-item span { font-size: 16px; }
        .price { color: #f39c12; font-weight: bold; }
        .order-btn { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .order-btn:hover { background: #27ae60; }
        .telegram-box { margin-top: 25px; padding-top: 15px; border-top: 1px solid #333; }
        .tg-btn { display: inline-block; background: #0088cc; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ROXAT Choyxona</h1>
        <div id="stolText">Stol aniqlanmoqda...</div>

        <h3>Taomlar Menyusi</h3>
        
        <div class="menu-item">
            <span>Osh (Palov)</span>
            <div>
                <span class="price">35,000 so'm</span>
                <button class="order-btn" onclick="addToOrder('Osh (Palov) - 35,000 so\'m')">Qo'shish</button>
            </div>
        </div>

        <div class="menu-item">
            <span>Manti (1 dona)</span>
            <div>
                <span class="price">6,000 so'm</span>
                <button class="order-btn" onclick="addToOrder('Manti (1 dona) - 6,000 so\'m')">Qo'shish</button>
            </div>
        </div>

        <div class="menu-item">
            <span>Shashlik (Go'sht)</span>
            <div>
                <span class="price">18,000 so'm</span>
                <button class="order-btn" onclick="addToOrder('Shashlik (Go\'sht) - 18,000 so\'m')">Qo'shish</button>
            </div>
        </div>

        <div class="menu-item">
            <span>Ko'k choy</span>
            <div>
                <span class="price">5,000 so'm</span>
                <button class="order-btn" onclick="addToOrder('Ko\'k choy - 5,000 so\'m')">Qo'shish</button>
            </div>
        </div>

        <div class="telegram-box">
            <p id="orderSummary" style="font-size: 14px; color: #bbb;">Hali hech narsa tanlamadingiz</p>
            <a id="tgLink" href="#" target="_blank" class="tg-btn" style="opacity: 0.5; pointer-events: none;">Telegramga Buyurtma Berish</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const stolNum = params.get('stol') || 'Nomaʼlum';
        document.getElementById('stolText').innerText = "Stol №: " + stolNum;

        let selectedItems = [];

        function addToOrder(item) {
            selectedItems.push(item);
            updateOrderUI();
        }

        function updateOrderUI() {
            const summary = document.getElementById('orderSummary');
            const tgLink = document.getElementById('tgLink');

            if (selectedItems.length === 0) {
                summary.innerText = "Hali hech narsa tanlamadingiz";
                tgLink.style.opacity = "0.5";
                tgLink.style.pointerEvents = "none";
            } else {
                summary.innerText = "Tanlanganlar: " + selectedItems.join(", ");
                
                // Bu yerga o'zingizning Telegram username yoki botingizni yozasiz (masalan: shohhhh1202)
                const cafeUsername = "SIZNING_TELEGRAM_USERNAME"; 
                const message = encodeURIComponent(`Salom! ${stolNum}-stoldan buyurtma:\n` + selectedItems.join("\n"));
                
                tgLink.href = `https://t.me/${cafeUsername}?text=${message}`;
                tgLink.style.opacity = "1";
                tgLink.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
